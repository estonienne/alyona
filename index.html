    let currentPanel = null;

    function toggleInfo(type) {
      const panel = document.getElementById("infoPanel");
      const overlay = document.getElementById("overlay");
      const title = document.getElementById("infoTitle");
      const content = document.getElementById("infoContent");
      const helixContainer = document.getElementById("helixContainer");

      if (!type || currentPanel === type) {
        // Close panel
        panel.classList.remove('open');
        overlay.classList.remove('active');
        overlay.style.backgroundImage = '';
        helixContainer.classList.remove('paused');
        currentPanel = null;
        return;
      }

      currentPanel = type;
      title.textContent = type.toUpperCase();
      content.innerHTML = '';

      // Pause animation when panel opens
      helixContainer.classList.add('paused');

      if (type === 'about') {
        overlay.style.backgroundImage = 'url(images/about-bg.png)';
        overlay.classList.add('active');

        content.innerHTML = `
          <div class="about-content">
            <p>Alyona Movko-Mägi (b. 1984, Tallinn, Estonia) is an interdisciplinary artist working at the intersection of expanded photography, material practice, and ecological memory. Her work explores how identity, landscape, and ancestral knowledge are embedded in both organic and digital forms.</p>
            
            <p>Drawing on analog and AI-based photography, glass, leather, textile, projection, and interaction design, she builds multisensory environments that reflect on care, disappearance, and transformation. Movko-Mägi's recent practice examines post-human embodiment, environmental trace, and the persistence of cultural memory through site-specific, time-based works.</p>
            
            <p>Movko-Mägi holds two MA degrees from the Estonian Academy of Arts — in Contemporary Art and Craft Studies — and teaches in the fields of digital fashion and experimental image-making.</p>
            
            <p>Her recent solo exhibition <em>SOO</em>, shown at the Estonian Museum of Photography, reimagines the bog as a slow-thinking body, combining analogue photography, cast glass, wet-molded leather, photogrammetry, and Gaussian Splatting animation to reflect on care, resistance, and layered time. Her work has been exhibited at Tallinn Art Hall, the Estonian Museum of Applied Art and Design, and in international contexts.</p>
          </div>`;
        
        panel.classList.add('open');
        return;
      }

      const list = document.createElement('ul');
      let items = [];

      if (type === 'works') items = works;
      else if (type === 'exhibitions') items = exhibitions;
      else if (type === 'texts') items = texts;
      else if (type === 'press') items = press;

      items.forEach(item => {
        const li = document.createElement('li');

        if (type === 'works') {
          li.className = 'work-entry';
          li.innerHTML = `
            <div class="work-title"><a href="${item.file}">${item.title}</a></div>
            <div class="work-year">${item.year}</div>
            <div class="work-description">${item.description}</div>
          `;
        } else if (type === 'exhibitions') {
          li.className = 'work-entry';
          li.innerHTML = `
            <div class="work-title"><a href="${item.file}">${item.title}</a></div>
            <div class="work-year">${item.year}</div>
            <div class="work-description">${item.venue}</div>
          `;
        } else if (type === 'texts') {
          li.className = 'work-entry';
          li.innerHTML = `
            <div class="work-title"><a href="${item.file}" target="_blank">${item.title}</a></div>
            <div class="work-year">${item.year}</div>
          `;
        } else if (type === 'press') {
          li.className = 'press-entry';
          li.innerHTML = `
            <div class="press-title">${item.title}</div>
            <div class="press-publication">${item.publication}</div>
            <a href="${item.link}" target="_blank">Read the article →</a>
          `;
        }

        list.appendChild(li);
      });

      content.appendChild(list);
      panel.classList.add('open');
    }
  
    function createHelix() {
      const container = document.getElementById('helixContainer');
      const loading = document.getElementById('loading');
      const radius = 280;
      const height = 700;
      const turns = 3.2;
      const totalPoints = phrases.length;

      container.innerHTML = '';

      for (let i = 0; i < totalPoints; i++) {
        const t = i / (totalPoints - 1);
        const angle = t * turns * 2 * Math.PI;
        const y = t * height;

        const phrase = phrases[i];
        const baseAngle = angle;
        
        for (let j = 0; j < phrase.length; j++) {
          const char = phrase[j];
          const charAngle = baseAngle + (j - phrase.length / 2) * 0.04;
          const charX = radius * Math.cos(charAngle);
          const charZ = radius * Math.sin(charAngle);
          const cameraOffset = 400;
          const charY = y + cameraOffset;

          const charDiv = document.createElement('div');
          charDiv.className = 'text-element';
          charDiv.textContent = char;
          charDiv.style.transform = `translate3d(${charX}px, ${charY - height / 2}px, ${charZ}px) rotateY(${charAngle}rad)`;
          container.appendChild(charDiv);
        }
      }

      // Hide loading indicator
      loading.classList.add('hidden');
    }

    // Enhanced mouse interaction with smoother response
    let mouseX = 0, mouseY = 0;
    let targetX = 0, targetY = 0;
    
    function updateRotation() {
      targetX += (mouseY - targetX) * 0.05;
      targetY += (mouseX - targetY) * 0.05;
      
      const container = document.getElementById('helixContainer');
      if (!container.classList.contains('paused')) {
        container.style.transform = `rotateY(${targetY * 15}deg) rotateX(${-targetX * 8}deg)`;
      }
      
      requestAnimationFrame(updateRotation);
    }

    document.addEventListener('mousemove', (e) => {
      const rect = document.body.getBoundingClientRect();
      mouseX = (e.clientX - rect.width / 2) / (rect.width / 2);
      mouseY = (e.clientY - rect.height / 2) / (rect.height / 2);
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && currentPanel) {
        toggleInfo(false);
      }
    });

    // Initialize
    window.addEventListener('load', () => {
      createHelix();
      updateRotation();
    });

    // Optimize performance
    window.addEventListener('beforeunload', () => {
      document.getElementById('helixContainer').style.animation = 'none';
    });
  </script>
