  <style>

  </style>
</head>
<body>
  <div class="name">Alyona Movko-Mägi</div>
  <div class="nav-links">
    <a onclick="toggleInfo('about')">about</a>
    <a href="cv.pdf">cv</a>
    <a onclick="toggleInfo('works')">works</a>
    <a onclick="toggleInfo('exhibitions')">exhibitions</a>
    <a onclick="toggleInfo('texts')">texts</a>
  </div>
  <canvas id="spiralCanvas"></canvas>
  <div class="footer">How do we root ourselves in uncertain ground?</div>

  <div id="infoPanel">
    <div id="closePanel" onclick="toggleInfo(false)">✕</div>
    <h2 id="infoTitle"></h2>
    <div id="infoContent"></div>
  </div>

  <script>
    const lines = [
  "Material memory",
  "Transformation and decay",
  "Loss and presence",
  "Care ethics",
  "Embodied presence",
  "Heritage and tradition",
  "Environmental mythologies",
  "Fragmented memory",
  "Temporal layering",
  "Anthropological and archaeological",
  "Field-based research",
  "Material experimentation",
  "Photographic documentation and intervention",
  "Digital reconstruction from archival images",
  "Volumetric rendering and speculative forms",
  "Dialogues between organic and industrial materials",
  "Installation as spatial narrative",
  "Collaboration with place and materials",
  "Preservation and disappearance",
  "Digital fossilization",
  "Alchemy and archives",
  "Land-based knowledge"
    ];
 const works = [
  { title: "RÜÜ", file: "ryy.html" },
  { title: "Sky Maiden", file: "sky_maiden.html" },
  { title: "Networked Myths: Weaving Identity Through the Threads of the Digital Age", file: "tase.html" },
   "Beyond the river",
  { title: "SEEN: it’s bitter so bitter, that it becomes sweet", file: "seen.html" },
  { title: "Sutures.duo", file: "suturesduo.html" },
  { title: "Sutures.duo", file: "sutures.html" },
  { title: "Biopoetics", file: "biopoetics.html" },
  { title: "Charter X", file: "charter.html" }
  ];

  const exhibitions = [
  { title: "Creature. Maker. Mire.", file: "mire.html" }, 
  { title: "Selected Interventions", file: "edtm.html" },
  { title: "Networked Myths: Weaving Identity Through the Threads of the Digital Age", file: "tase.html" },
  { title: "Objects or Things", file: "eseasi.html" },
    "Live, Love, Stuff!"
  

  ];
  const  texts = [
  { title: "From Disappearance to Reimagination: Crafting Heritage in a Vanishing World", file: "texts/SkyMaiden.pdf" },
  { title: "SEEN: it’s bitter so bitter, that it becomes sweet", file: "texts/seen.pdf" },

  ]


    const canvas = document.getElementById("spiralCanvas");
    const ctx = canvas.getContext("2d");
    let width, height, centerX, centerY;
    let t = 0;
    let rotation = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      centerX = width / 2;
      centerY = height / 2;
    }

    function drawSpiral() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#111";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const a = 4;
      const b = 10;
      let angle = rotation;

      for (let i = 0; i < lines.length; i++) {
        angle += 0.35;
        const r = a + b * (angle + t);
        const x = centerX + r * Math.cos(angle);
        const y = centerY + r * Math.sin(angle);
        const scale = 1 + (i / lines.length);
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle + Math.PI / 2);
        ctx.font = `${Math.floor(12 * scale)}px monospace`;
        ctx.fillText(lines[i], 0, 0);
        ctx.restore();
      }

      rotation += 0.0012;
      t += 0.007;
      requestAnimationFrame(drawSpiral);
    }

    function toggleInfo(type) {
      const panel = document.getElementById("infoPanel");
      const title = document.getElementById("infoTitle");
      const content = document.getElementById("infoContent");

      if (!type) {
        panel.style.transform = 'translateX(100%)';
        return;
      }

      title.textContent = type.toUpperCase();
      content.innerHTML = '';

      const list = document.createElement('ul');
      let items = [];

      if (type === 'works') items = works;
      else if (type === 'exhibitions') items = exhibitions;
      else if (type === 'texts') items = texts;
      else if (type === 'about') {
        content.innerHTML = `<p style="font-size: 13px; white-space: pre-wrap">
Alyona Movko-Mägi (b. 1984, Tallinn, Estonia) is an interdisciplinary artist working at the intersection of expanded photography, material practice, and ecological memory. Her work explores how identity, landscape, and ancestral knowledge are embedded in both organic and digital forms.

Drawing on analog and AI-based photography, glass, leather, textile, projection, and interaction design, she builds multisensory environments that reflect on care, disappearance, and transformation. Movko-Mägi’s recent practice examines post-human embodiment, environmental trace, and the persistence of cultural memory through site-specific, time-based works.

Movko-Mägi holds two MA degrees from the Estonian Academy of Arts — in Contemporary Art and Craft Studies — and teaches in the fields of digital fashion and experimental image-making.

Her recent solo exhibition SOO, shown at the Estonian Museum of Photography, reimagines the bog as a slow-thinking body, combining analogue photography, cast glass, wet-molded leather, photogrammetry, and Gaussian Splatting animation to reflect on care, resistance, and layered time. Her work has been exhibited at Tallinn Art Hall, the Estonian Museum of Applied Art and Design, and in international contexts.
        </p>`;
        panel.style.transform = 'translateX(0)';
        return;
      }

      items.forEach(item => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = item.file;
        a.textContent = item.title;
        a.target = "_blank";
        li.appendChild(a);
        list.appendChild(li);
      });

      content.appendChild(list);
      panel.style.transform = 'translateX(0)';
    }

    window.addEventListener("resize", () => {
      resize();
      drawSpiral();
    });

    resize();
    drawSpiral();
  </script>
</body>
</html>
